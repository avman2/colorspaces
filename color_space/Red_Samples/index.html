<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Red Color Gamut Gallery</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    padding:12px;
}

h1{
    text-align:center;
    margin-bottom:16px;
    font-size:1.5rem;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.image-link{
    display:block;
}

.card img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:#fafafa;
    display:block;
}

.caption{
    padding:8px;
    text-align:center;
    font-size:.9rem;
    font-weight:600;
    word-break:break-word;
}

.actions{
    padding:0 8px 12px;
    text-align:center;
}

.download-btn{
    display:inline-block;
    padding:8px 14px;
    background:#0078d4;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-size:.85rem;
}

.download-btn:hover{
    background:#005fa3;
}

/* Tablet */
@media (min-width:768px){
    .gallery{
        grid-template-columns:repeat(3,1fr);
    }

    .card img{
        height:300px;
    }
}

/* Desktop */
@media (min-width:1200px){
    .gallery{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>
<body>

<h1>Color Gamut Images</h1>

<div id="gallery" class="gallery"></div>

<script>
const images = [
    "Red_Adobe_RGB.png",
    "Red_dci-p3.png",
    "Red_Rec2020.png",
    "Red_sRGB.png",
    "Red_wide_gamut.png"
];

const gallery = document.getElementById("gallery");

images.forEach(file => {
    gallery.insertAdjacentHTML(
        "beforeend",
        `
        <div class="card">
            <a href="${file}" target="_blank" class="image-link">
                <img src="${file}"
                     alt="${file}"
                     loading="lazy">
            </a>

            <div class="caption">${file}</div>

            <div class="actions">
                <a href="${file}"
                   download
                   class="download-btn">
                   Download Full Resolution
                </a>
            </div>
        </div>
        `
    );
});
</script>

</body>
</html>
